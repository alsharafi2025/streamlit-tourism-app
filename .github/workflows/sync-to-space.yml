name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install huggingface_hub
        run: pip install huggingface_hub
      - name: Push files to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          username = api.whoami()['name']
          space_id = f"{username}/streamlit-tourism-app"
          for fname in ['app.py', 'requirements.txt', 'best_model.pkl.gz', 'README.md']:
              if os.path.exists(fname):
                  api.upload_file(path_or_fileobj=fname, path_in_repo=fname,
                                  repo_id=space_id, repo_type='space',
                                  token=os.environ['HF_TOKEN'])
                  print('synced', fname)
          print('Space URL: https://huggingface.co/spaces/' + space_id)
          EOF
